name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pytest -e '.[needle]'
      - run: python -m pytest -q
      - run: cargo test --lib
      - run: python -m json.tool benchmarks/proof-summary.json >/dev/null