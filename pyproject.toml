[project]
name = "browser-action-bench"
version = "0.1.0"
description = "Measure browser automation actions per minute across tool-calling models"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
needle = ["cactus-needle>=3.0.0", "playwright>=1.50"]

[tool.setuptools]
py-modules = ["neeble", "neeble_tool", "neeble_mcp", "benchmark_scenarios", "benchmark_domains"]
packages = ["babench", "integrations"]
[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
babench = "babench.cli:main"
neeble = "neeble:main"
neeble-mcp = "neeble_mcp:main"
